[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "repvision-yolo-pose"
version = "0.1.0"
description = "Real-time bicep-curl counting with YOLO Pose and OpenCV"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
